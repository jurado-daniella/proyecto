<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar acceso | DAM</title><link rel="stylesheet" href="css/estilos.css?v=20261111g"></head><body><main class="auth-main"><form class="auth-form" id="recuperacion"><a href="login.html">← Volver a iniciar sesión</a><h1 id="recuperar-titulo">Recuperar contraseña</h1><p id="recuperar-ayuda">Ingrese el correo registrado para solicitar ayuda a coordinación. La nueva contraseña se entrega en persona, después de verificar su identidad.</p><div id="mensajes"></div><label class="field" id="correo-field">Correo de la cuenta<input name="correo" type="email" autocomplete="email" maxlength="120" required></label><div id="nueva-fields" hidden><label class="field">Nueva contraseña<input name="nueva" type="password" autocomplete="new-password" minlength="8" maxlength="72"></label><label class="field">Confirmar contraseña<input name="confirmacion" type="password" autocomplete="new-password" minlength="8" maxlength="72"></label></div><button class="btn btn-red" id="recuperar-boton">Enviar solicitud al administrador</button></form></main><script src="js/comun.js?v=20261111g"></script><script src="js/recuperar.js?v=20261111g"></script></body></html>
