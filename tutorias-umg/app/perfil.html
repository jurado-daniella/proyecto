<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi cuenta | DAM</title><link rel="stylesheet" href="css/estilos.css?v=20261111final"></head><body class="panel"><header id="barra" class="barra"></header><main class="main"><section class="tarjeta"><h1 class="tarjeta-titulo">Cambiar contraseña</h1><div id="mensajes" class="stack"></div><form id="clave" class="form-grid" style="padding:1rem"><label>Contraseña actual<input type="password" name="actual" autocomplete="current-password" required maxlength="72"></label><label>Nueva contraseña<input type="password" name="nueva" autocomplete="new-password" required minlength="8" maxlength="72"></label><label>Confirmar nueva contraseña<input type="password" name="confirmacion" autocomplete="new-password" required minlength="8" maxlength="72"></label><p>Use una contraseña diferente, de al menos 8 caracteres. Las otras sesiones perderán acceso.</p><button class="btn btn-red">Guardar contraseña</button></form></section></main><script src="js/comun.js?v=20261111final"></script><script src="js/perfil.js?v=20261111final"></script></body></html>
